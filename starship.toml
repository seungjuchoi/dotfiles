# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[➜](bold green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[nodejs]
disabled = true

# Kiro CLI's fish integration (fig_precmd) spawns a background job on every
# prompt, so the job count is permanently off by one and always renders "✦".
[jobs]
disabled = true

[env_var.DISPLAY]
format = "[🖥️]($env_value) "

[env_var.https_proxy]
format = "[🚪env]($env_value) "

[env_var.PROXYCHAINS_CONF_FILE]
format = "[🚪chain]($env_value) "
