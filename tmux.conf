unbind c-b
set -g prefix c-t
bind c-t send-prefix
# C-b 도 보조 프리픽스로 (원래 기본키)
set -g prefix2 c-b
bind c-b send-prefix -2

set -s extended-keys off
# set -as terminal-features 'xterm*:extkeys'
set -g mouse on
set -wg mode-keys vi
set -g allow-passthrough on
# reattach-to-user-namespace 래퍼는 pane_current_path 추적을 막아
# automatic-rename(폴더명 윈도우 이름)이 동작하지 않게 하므로 제거.
# 최신 macOS + tmux에서는 클립보드 연동에 더 이상 필요 없음.
set -g repeat-time 0
set -g default-terminal "tmux-256color"
set -sa terminal-features ',xterm-256color:RGB'
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -wg pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g status-right-length 60
# 세션 리스트 — ID순 정렬, 단축키 1부터 (상태바 세션 순번과 일치)
# Ctrl+, 는 prefix 없이, prefix+s 는 기본 바인딩 대체
bind -n C-, choose-tree -sZ -O index -K '#{?#{e|<:#{line},9},#{e|+:#{line},1},}'
bind s choose-tree -sZ -O index -K '#{?#{e|<:#{line},9},#{e|+:#{line},1},}'

# 세션 순번(@pos) 갱신 — 상태바 세션 탭 번호가 choose-tree 단축키와 일치하도록
set-hook -g session-created 'run-shell "~/.tmux/renumber-sessions.sh"'
set-hook -g session-closed 'run-shell "~/.tmux/renumber-sessions.sh"'
run-shell "~/.tmux/renumber-sessions.sh"

bind '"' split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# Ctrl 누른 채 t 다음 v / - — 분할 (Ctrl 떼지 않고, 한글 IME 통과).
# Ctrl+- 는 터미널마다 0x1f(C-_ / C-/)로 오거나 그대로 C-- 로 오므로 셋 다 바인딩.
bind C-v split-window -h -c "#{pane_current_path}"
bind C-- split-window -v -c "#{pane_current_path}"
bind C-_ split-window -v -c "#{pane_current_path}"
bind C-/ split-window -v -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jaclu/tmux-mouse-swipe'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# pane 스크롤백까지 저장/복원. 아카이브는 pane_contents.tar.gz 단일 파일이라 누적되지 않는다.
set -g @resurrect-capture-pane-contents 'on'
# Minimal status bar
set -g status 2
set -g status-position bottom
set -g status-style "bg=default,fg=colour248"
set -g @session-tabs "#{S:#{?#{==:#{session_name},#{client_session}},#[range=session|#{session_id} fg=colour208#,bold] #{@pos} #{=/18/...:session_name} #[norange default],#[range=session|#{session_id} fg=colour240] #{@pos} #{=/18/...:session_name} #[norange default]}}"
set -g status-format[0] "#[align=left]#{T;=/#{status-left-length}:status-left}#[list=on align=#{status-justify}]#{W:#{E:window-status-format},#{E:window-status-current-format}}"
set -g status-format[1] "#[align=left]#{E:@session-tabs}#[align=right]#{T;=/#{status-right-length}:status-right}"
set -g status-left ""
set -g status-left-length 0
# status-right 는 tpm run 뒤에 정의한다 (continuum 자동저장 보간).
set -g window-status-format "#[range=window|#{window_index} fg=colour240] #I #W#{?window_zoomed_flag, [Z],} #[norange list=on default]"
set -g window-status-current-format "#[range=window|#{window_index} list=focus fg=colour255,bold] #I #W#{?window_zoomed_flag, [Z],} #[norange list=on default]"
set -g window-status-separator ""
set -g message-style "bg=default,fg=colour4"
set -g message-command-style "bg=default,fg=colour4"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# vim-like pane switching
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R
# Ctrl 누른 채 t 다음 h/j/k/l — Ctrl 조합이라 한글 IME 통과.
bind C-k select-pane -U
bind C-j select-pane -D
bind C-h select-pane -L
bind C-l select-pane -R
# 한글일 때 Ctrl+H는 macOS 입력기가 backspace로 바꿔 보냄 → BSpace도 pane-left로.
bind BSpace select-pane -L
# Ctrl 누른 채 t 다음 c — 새 window 생성 (한글 IME 통과).
bind C-c new-window

# prefix 다음 f — main 세션에 현재 pane 디렉터리로 window 를 만들고 그 창으로 이동.
# agent(cl/co 등)는 열린 창에서 직접 실행한다. tmux 기본 f(find-window)를 덮는다.
# C-f 는 Ctrl 유지용(한글 IME 통과), ㄹ 은 한글 입력 상태의 f 키.
bind f run-shell "~/.tmux/agent-window.sh '#{pane_current_path}'"
bind C-f run-shell "~/.tmux/agent-window.sh '#{pane_current_path}'"
bind ㄹ run-shell "~/.tmux/agent-window.sh '#{pane_current_path}'"
# Ctrl 누른 채 t 다음 x — pane 닫기 (한글 IME 통과).
# display-menu는 첫 항목이 기본 선택 → Enter로 바로 닫힘. Esc/n 취소.
bind C-x display-menu -T "#[align=centre] kill-pane #P? " -x P -y P \
  "Kill" k { kill-pane } \
  "Cancel" n ""

# Resizing pane
bind -n C-S-Up resize-pane -U 5
bind -n C-S-Down resize-pane -D 5
bind -n C-S-Left resize-pane -L 5
bind -n C-S-Right resize-pane -R 5

# Move window
bind C-Left swap-window -t -1 \; previous-window
bind C-Right swap-window -t +1 \; next-window

# tmuxcc — AI 에이전트(Claude Code 등) pane 대시보드 팝업. C-g는 한글 IME 통과용.
# 런처가 PATH를 보정하고, 미설치면 안내 후 그 자리에서 설치까지 한다.
bind g display-popup -E -w 90% -h 85% "~/.local/bin/tmuxcc-launch"
bind C-g display-popup -E -w 90% -h 85% "~/.local/bin/tmuxcc-launch"
# G — 포크 clone(없으면) + origin pull + upstream 병합 후 재빌드·설치.
bind G display-popup -E -w 80% -h 70% "~/.local/bin/tmuxcc-update --pause"

# lazygit 팝업 바인딩은 tmux-yank(prefix+y)를 덮어써야 해서 tpm run 아래에 있음.

# Detach — q도 d와 동일하게 동작 (기본 display-panes 대체)
bind q detach-client

# New Session
bind N command-prompt -p "Session Name:" "new-session -s '%%'"

# Kill Session and Select Session
bind X run "tmux switch-client -n && tmux kill-session -t '#S' && tmux choose-session"

