# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# continuum 은 자동저장을 status-right 의 #(continuum_save.sh) 로 돌리는데, 그 주입을
# another_tmux_server_running() 오탐 때문에 건너뛸 때가 있다 (건너뛰면 그 서버가 죽을
# 때까지 자동저장 영구 정지). 여기서 직접 넣어 continuum 로딩 결과와 무관하게 보장한다.
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=colour240]│ #[fg=colour208,bold]#H "

# lazygit 팝업 — 현재 pane 디렉터리 기준.
# tmux-yank 가 prefix+y 를 copy_line 으로 잡으므로 tpm run *뒤에* 바인딩해 덮어쓴다.
# C-y 는 Ctrl 유지용(한글 IME 통과), ㅛ 는 한글 입력 상태의 y 키.
bind y display-popup -E -d "#{pane_current_path}" -w 90% -h 85% -T " lazygit " \
  'command -v lazygit >/dev/null && exec lazygit || { echo "lazygit not found in PATH"; read -r _; }'
bind C-y display-popup -E -d "#{pane_current_path}" -w 90% -h 85% -T " lazygit " \
  'command -v lazygit >/dev/null && exec lazygit || { echo "lazygit not found in PATH"; read -r _; }'
bind ㅛ display-popup -E -d "#{pane_current_path}" -w 90% -h 85% -T " lazygit " \
  'command -v lazygit >/dev/null && exec lazygit || { echo "lazygit not found in PATH"; read -r _; }'

# Pane border
set -g pane-border-lines heavy
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour208,bg=default
