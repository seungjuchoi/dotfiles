onboarding = false

[ui]
# prefix+c 로 새 탭을 만들 때 이름을 묻지 않고 바로 만든다
prompt_new_tab_name = false

# 사이드바 claude 행에 터미널 제목(세션 제목)을 함께 보여준다
status_indicators = "symbols"
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "terminal_title_stripped"], ["machine", "workspace", "tab"]]
# kiro 는 터미널 제목에 세션 제목을 안 쓴다. timer.kiro-title 플러그인이 $title 토큰으로 보내준다
kiro = [["state_icon", "$title"], ["machine", "workspace", "tab"]]

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
prefix = "ctrl+t"
# 한글 입력 상태에선 ctrl+t가 ctrl+ㅅ으로 들어온다
extra_prefixes = ["ctrl+ㅅ"]

# prefix 뒤 알파벳 키를 ctrl을 누른 채로도 동작하게 (기존 바인딩 유지 + ctrl 버전 추가)
# 세 번째 항목은 한글 입력 상태의 같은 물리 키(두벌식 자모)
settings          = ["prefix+s", "prefix+ctrl+s", "prefix+ㄴ"]
# ctrl+, 는 prefix 없이 바로 연다 (한글 입력 상태에서도 그대로 , 가 온다)
workspace_picker  = ["prefix+w", "prefix+ctrl+w", "prefix+ㅈ", "ctrl+,"]
goto              = ["prefix+g", "prefix+ctrl+g", "prefix+ㅎ"]
detach            = ["prefix+q", "prefix+ctrl+q", "prefix+ㅂ"]
# o 는 tmux 처럼 AI 탭에 쓰고, 알림 대상 열기는 i 로 옮겼다 (ctrl+i 는 Tab 과 겹쳐 뺌)
open_notification_target = ["prefix+i", "prefix+ㅑ"]
new_tab           = ["prefix+c", "prefix+ctrl+c", "prefix+ㅊ"]
# n/p 는 탭이 아니라 사이드바 agents 목록을 위아래로 이동한다
previous_agent    = ["prefix+p", "prefix+ctrl+p", "prefix+ㅔ"]
next_agent        = ["prefix+n", "prefix+ctrl+n", "prefix+ㅜ"]
# 탭 이동은 [ / ] (스크롤백 편집은 안 써서 키를 뺐다)
# ctrl 을 쥔 채 누르면 ctrl+] 는 ctrl+5(0x1d) 로 온다. ctrl+[ 는 Ghostty keybind 로 CSI u 를 보내게 했다
previous_tab      = ["prefix+[", "prefix+ctrl+["]
next_tab          = ["prefix+]", "prefix+ctrl+]", "prefix+ctrl+5"]
edit_scrollback   = []
# 키보드로 스크롤백 보기 (j/k·pgup/pgdn·/ 검색·q 종료)
copy_mode         = ["prefix+space", "prefix+ctrl+space"]
focus_pane_left   = ["prefix+h", "prefix+ctrl+h", "prefix+ㅗ", "prefix+backspace"]  # 한글일 때 ctrl+h는 backspace로 옴
focus_pane_down   = ["prefix+j", "prefix+ctrl+j", "prefix+ㅓ"]
focus_pane_up     = ["prefix+k", "prefix+ctrl+k", "prefix+ㅏ"]
focus_pane_right  = ["prefix+l", "prefix+ctrl+l", "prefix+ㅣ"]
split_vertical    = ["prefix+v", "prefix+ctrl+v", "prefix+ㅍ"]
split_horizontal  = ["prefix+minus", "prefix+ctrl+minus", "prefix+\""]  # " 는 tmux 습관
close_pane        = ["prefix+x", "prefix+ctrl+x", "prefix+ㅌ"]
zoom              = ["prefix+z", "prefix+ctrl+z", "prefix+ㅋ"]
resize_mode       = ["prefix+r", "prefix+ctrl+r", "prefix+ㄱ"]
toggle_sidebar    = ["prefix+b", "prefix+ctrl+b", "prefix+ㅠ"]

[experimental]
# prefix 모드 동안 입력 소스를 영문으로 잠깐 바꿨다가 끝나면 복원
switch_ascii_input_source_in_prefix = true


# ── tmux.conf 와 맞춘 커스텀 키 ──
# 키마다 prefix+X / prefix+ctrl+X(Ctrl 유지, 한글 IME 통과) / prefix+자모(한글 입력 상태) 세 벌.

# f — tz 워크스페이스에 tz 폴더로 새 탭(셸)
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "~/.config/herdr/main-tab.sh"
description = "new tab in tz"

[[keys.command]]
key = "prefix+ctrl+f"
type = "shell"
command = "~/.config/herdr/main-tab.sh"
description = "new tab in tz"

[[keys.command]]
key = "prefix+ㄹ"
type = "shell"
command = "~/.config/herdr/main-tab.sh"
description = "new tab in tz"

# o — f 와 같지만 MAIN_AI_CMD(기본 cl)를 바로 실행
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "~/.config/herdr/main-tab.sh --ai"
description = "new AI tab in tz"

[[keys.command]]
key = "prefix+ctrl+o"
type = "shell"
command = "~/.config/herdr/main-tab.sh --ai"
description = "new AI tab in tz"

[[keys.command]]
key = "prefix+ㅐ"
type = "shell"
command = "~/.config/herdr/main-tab.sh --ai"
description = "new AI tab in tz"

# e — fzf 파일 피커, 고른 경로를 현재 pane 에 붙여넣기
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "~/.config/herdr/file-picker.sh"
description = "file picker"
width = "70%"
height = "70%"

[[keys.command]]
key = "prefix+ctrl+e"
type = "popup"
command = "~/.config/herdr/file-picker.sh"
description = "file picker"
width = "70%"
height = "70%"

[[keys.command]]
key = "prefix+ㄷ"
type = "popup"
command = "~/.config/herdr/file-picker.sh"
description = "file picker"
width = "70%"
height = "70%"

# y — lazygit 팝업 (현재 pane 디렉터리)
[[keys.command]]
key = "prefix+y"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-.}" && PATH=/opt/homebrew/bin:$PATH && exec lazygit'
description = "lazygit"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+y"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-.}" && PATH=/opt/homebrew/bin:$PATH && exec lazygit'
description = "lazygit"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+ㅛ"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-.}" && PATH=/opt/homebrew/bin:$PATH && exec lazygit'
description = "lazygit"
width = "90%"
height = "85%"

# u — yazi 팝업 (현재 pane 디렉터리)
[[keys.command]]
key = "prefix+u"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-.}" && PATH=/opt/homebrew/bin:$PATH && exec yazi'
description = "yazi"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+u"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-.}" && PATH=/opt/homebrew/bin:$PATH && exec yazi'
description = "yazi"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+ㅕ"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-.}" && PATH=/opt/homebrew/bin:$PATH && exec yazi'
description = "yazi"
width = "90%"
height = "85%"

# \ — tmux-fingers 처럼 화면의 URL·경로·SHA 등에 힌트 글자를 띄우고, 그 글자를 치면 복사 (seungjuchoi/herdr-pluck)
# ctrl 을 쥔 채 누르면 ctrl+\ 는 ctrl+4(0x1c) 로 올 수 있어 둘 다 넣었다. 한글 입력 상태에선 ₩ 로 온다
[[keys.command]]
key = "prefix+backslash"
type = "plugin_action"
command = "seungjuchoi.herdr-pluck.pluck"
description = "pluck visible token"

[[keys.command]]
key = "prefix+ctrl+backslash"
type = "plugin_action"
command = "seungjuchoi.herdr-pluck.pluck"
description = "pluck visible token"

[[keys.command]]
key = "prefix+ctrl+4"
type = "plugin_action"
command = "seungjuchoi.herdr-pluck.pluck"
description = "pluck visible token"

[[keys.command]]
key = "prefix+₩"
type = "plugin_action"
command = "seungjuchoi.herdr-pluck.pluck"
description = "pluck visible token"

[ui.toast]
delivery = "herdr"
