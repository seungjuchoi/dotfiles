# herdr — https://herdr.dev
# Linked to ~/.config/herdr/config.toml by 3_set_config.fish
# Reload running server: herdr server reload-config  (or prefix+Shift+r)

onboarding = false

[theme]
# ghostty_config theme = TokyoNight 과 맞춤
name = "tokyo-night"

[terminal]
# 서버를 누가 띄우든($SHELL 상속에 의존하지 않고) 항상 fish를 쓴다.
default_shell = "/opt/homebrew/bin/fish"

[keys]
# tmux 근육기억 유지 (tmux.conf prefix = c-t, 보조 c-b)
prefix = "ctrl+t"

# 기본값과 동일하지만 의도를 명시 (tmux bind q detach 와 동일)
detach = "prefix+q"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# lazygit 팝업 — config.fish 의 lg 와 같은 용도
[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
width = "90%"
height = "85%"

[ui]
# agent 패널을 워크스페이스(space) 기준으로 묶음
agent_panel_sort = "spaces"
# tmux status 의 colour208(주황) 과 비슷한 포인트 컬러
accent = "#ff8700"

[ui.toast]
# 백그라운드 에이전트 상태 변화를 OS 알림으로
delivery = "system"

[experimental]
# 한글 IME 활성 시에도 prefix 키 입력이 먹히도록 ASCII 입력원으로 잠시 전환
# (tmux.conf 의 C-hjkl / BSpace 한글 IME 대응과 같은 문제 영역)
switch_ascii_input_source_in_prefix = true
# Claude Code / pi / codex 등 자체 커서 그리는 TUI 에서 macOS IME 후보창 추적
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "pi", "codex", "grok", "opencode", "gemini", "cursor", "kiro"]
cjk_ime_cursor_shape = "steady_block"
